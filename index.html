<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Janala</title>

    <!-- English Janala Web Icon -->
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">

    <!-- tailwind + daisyui cdn -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome cdn -->

    <!-- poppins font link -->

    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style> 

    <!-- hindi siliguri font link -->
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');

    <link rel="stylesheet" href="styles/style.css">

<body>
<!-- NAVBAR SECTION -->
<div class="border-b border-b-[#C6BDBD] bg-[#BADEFF46]">
    <div class="navbar bg-base-100  w-11/12 mx-auto bg-transparent p-0">

    <div class="navbar-start w-full">

    <div class="dropdown">

      <div tabindex="0" role="button" class="btn btn-ghost sm:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /></svg>
      </div>

      <ul
        tabindex="-1"
        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-2 w-auto p-2 space-y-2">
            <li>
                <a href="#" class="btn btn-outline btn-primary"><i class="fa-solid fa-circle-question"></i>FAQ</a>
            </li>
            <li>
                <a href="#" class="btn btn-outline btn-primary"><i class="fa-solid fa-book-open"></i>Learn</a>
            </li>
            <li>
                <a href="#"class="btn btn-outline btn-primary"><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</a>
            </li>
      </ul>

    </div>

<!-- logo area -->
    <div class="w-full">
        <a class="flex items-center justify-center sm:justify-start gap-1 ">
        <span class="text-xl font-bold hind-siliguri-font">English</span>
        <img src="assets/logo.png" alt="Website-Logo">
        <span class="text-xl font-semibold hind-siliguri-font">জানালা</span>
        </a>
    </div>

    </div>
    <div class="navbar-end hidden sm:flex space-x-3">
        <a href="#" class="btn btn-outline btn-primary"><i class="fa-solid fa-circle-question"></i>FAQ</a>
        <a href="#" class="btn btn-outline btn-primary"><i class="fa-solid fa-book-open"></i>Learn</a>
        <a href="#"class="btn btn-outline btn-primary"><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</a>
    </div>
</div>
</div>

<!-- HERO SECTION -->
<section class="flex flex-col-reverse md:flex-row justify-between w-11/12 mx-auto py-0 md:py-10 lg:py-0">
    <!-- hero left side -->
    <div class=" flex flex-col my-auto items-center md:items-start space-y-4 flex-1">

        <div class="text-5xl font-bold text-center md:text-start"> 
            <span class="text-[#00BCFF]">English </span>
            <span>is Easy!!</span>
        </div>

        <div>
            <p class="text-2xl hind-siliguri-font text-center md:text-start">আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive Lessons আপনাকে নিয়ে যাবে অন্য একটি Level এ</p>
        </div>

        <div class="space-y-4 text-center md:text-start">
            <input type="text" placeholder="Enter Your Name" class="input input-primary" />

            <input type="text" placeholder="........" class="input input-primary" />
        </div>

        <div class=" text-center md:text-start">
            <button class="hero-btn btn btn-active btn-primary">Get Started</button>
        </div>

    </div>
    <!-- hero right side -->
    <div class="hero-img flex-1">
        <img src="assets/hero-student.png" alt="student-pic">
    </div>
</section>


<script src="script.js"></script>
